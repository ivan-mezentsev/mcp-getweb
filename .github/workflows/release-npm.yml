name: release-npm

on:
  workflow_run:
    workflows: ["build-matrix"]
    types: [completed]

permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:

  publish-npm:
    name: Publish npm
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      NPM_CONFIG_PROVENANCE: "true"
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Update npm CLI
        run: npm install -g npm@latest

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd unzip gh

      - name: Resolve tag from workflow SHA
        id: resolve_tag
        shell: bash
        run: |
          set -euo pipefail
          head_sha="${{ github.event.workflow_run.head_sha }}"
          tag="$(git tag --points-at "$head_sha" | head -n 1 || true)"
          if [[ -z "$tag" ]]; then
            echo "Unable to resolve tag for SHA: $head_sha" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Pack and publish
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.resolve_tag.outputs.tag }}"
          ./npm/mcp-getweb/pack_npm.sh --repo "${{ github.repository }}" "$tag" --dir ../../dist
